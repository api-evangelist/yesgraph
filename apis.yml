name: YesGraph
description: >-
  YesGraph was a San Francisco startup (YC W13) that provided a referral and
  contact-recommendation API. Its HTTP API and SDKs let mobile and web apps
  upload a user's address book and receive a machine-learning ranked list of
  which contacts a user should invite, powering smarter invite and referral
  flows. Founded by Ivan Kirigin (ex-Dropbox, ex-Facebook), YesGraph worked
  with companies including Airbnb, Atlassian, Gusto and Hired. In 2017 the
  team and its social-graph technology joined Lyft to strengthen Lyft's
  in-house referral program, and the public YesGraph API was deactivated on
  August 31, 2017. This profile documents the historical developer surface;
  the API is retired and no longer accepting traffic.
